name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "部署环境"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy-staging:
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取最新镜像
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest backend:${{ env.IMAGE_TAG }}
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest frontend:${{ env.IMAGE_TAG }}

      - name: 部署到 Staging 服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/ai-manga-agent
            docker compose pull
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans
            docker system prune -f

      - name: 健康检查
        run: |
          sleep 15
          curl -f http://${{ secrets.STAGING_HOST }}/api/v1/health || exit 1
          curl -f http://${{ secrets.STAGING_HOST }}/ || exit 1

      - name: 发送部署通知（飞书）
        if: always()
        uses: certs/feishu-notification@v4
        with:
          webhook: ${{ secrets.FEISHU_WEBHOOK }}
          title: "AI-Manga-Agent 部署通知"
          text: |
            环境: Staging
            版本: ${{ env.IMAGE_TAG }}
            状态: ${{ job.status }}
            提交: ${{ github.sha }}

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy-staging]
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取镜像并打标签
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest backend:${{ env.IMAGE_TAG }}
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest frontend:${{ env.IMAGE_TAG }}

      - name: 部署到生产环境
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/ai-manga-agent
            docker compose pull
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --remove-orphans
            docker system prune -f

      - name: 滚动更新健康检查
        run: |
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.PROD_DOMAIN }}/api/v1/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "健康检查通过"
              exit 0
            fi
            echo "等待服务启动... ($i/12)"
            sleep 10
          done
          echo "健康检查失败"
          exit 1

      - name: 部署回滚
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/ai-manga-agent
            docker compose -f docker-compose.yml -f docker-compose.production.yml down
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --remove-orphans

      - name: 发送部署通知（飞书）
        if: always()
        uses: certs/feishu-notification@v4
        with:
          webhook: ${{ secrets.FEISHU_WEBHOOK_PROD }}
          title: "AI-Manga-Agent 生产部署通知"
          text: |
            环境: Production
            版本: ${{ env.IMAGE_TAG }}
            状态: ${{ job.status }}
            提交: ${{ github.sha }}