[alembic]
# 迁移脚本目录
script_location = alembic

# SQLAlchemy 数据库 URL（async 驱动兼容格式）
# 实际连接串由 app.core.config.settings 提供，此处仅作占位
# 迁移时使用 env.py 中 get_url() 函数动态获取
sqlalchemy.url = postgresql+asyncpg://manga:manga123@localhost:5432/manga_agent

# 模板文件路径
file_template = %%(rev)s_%%(slug)s

# 迁移消息的 Python 模块路径前缀
truncate_slug_length = 40

# 生成的 SQL 输出编码
output_encoding = utf-8

# 版本路径（相对于 script_location）
version_paths = versions

# 版本路径分隔符
version_path_separator = os

# 自动迁移时是否包含模式名
include_schemas = False

# 创建的迁移版本号格式
# 可选: "7位数字" (default) / "分支标签+数字"
# 使用 "epoch" 格式生成时间戳版本号
# trun_start 用于指定起始时间戳
# 使用 "epoch" 格式
# revision_environment = true


[post_write_hooks]

# log 输出钩子，在生成迁移脚本后自动记录
# hooks = log
# log.type = console
# log.filename = %(here)s/logs/alembic.log


[loggers]
keys = root,sqlalchemy,alembic,manga

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_manga]
level = DEBUG
handlers =
qualname = manga

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S